services:
  mysql:
    image: mysql:8.0
    container_name: truyenfull_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: truyenfull_db
      MYSQL_USER: truyenfull_user
      MYSQL_PASSWORD: truyenfull_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./mysql/02_init_voices.sql:/docker-entrypoint-initdb.d/02_init_voices.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    # networks:
    #   - truyenfull_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot123",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: truyenfull_redis
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - truyenfull_network
  #   command: redis-server --appendonly yes

volumes:
  mysql_data:
    driver: local
